[versions]
agp = "9.2.1"
core = "1.7.0"
foundation = "1.11.1"
junit = "4.13.2"
junitVersion = "1.3.0"
kotlin = "2.3.10"
android-minSdk = "24"
android-compileSdk = "36"
composeMultiplatform = "1.11.1"
kotlinxCoroutinesCore = "1.11.0"
runtime = "1.11.1"
vanniktechMavenPublish = "0.36.0"

[libraries]
foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "foundation" }
runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "runtime" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
junit = { module = "junit:junit", version.ref = "junit" }
core = { module = "androidx.test:core", version.ref = "core" }
ext-junit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }